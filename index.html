<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haunted Heist Avatar Maker</title>
<!--
  Profile picture maker built on the character creator. Every picture is a stack of
  layers baked in-engine by BenchTools/pfp_layer_bake.tscn into layers/ (see manifest.json):
  skin (tinted by body color) < clothes < face < hat skin (tinted) < hat.
  Serve this folder over http (fetch() can't read file://), e.g. `python -m http.server`.
-->
<style>
  /* Game UI palette (UI Theme/*.tres): red pill buttons with 2px black borders,
     cream button text with a black outline, near-black translucent panels.
     Font: the game's Dazzle Unicase (copied into fonts/). */
  @font-face {
    font-family: "Dazzle Unicase";
    src: url("fonts/DazzleUnicase-Bold.otf") format("opentype");
    font-weight: 700;
    font-display: swap;
  }
  :root {
    --bg: #0b0909;
    --panel: rgba(25, 25, 25, 0.83);
    --tile: #1c1818;
    --tile-hover: #2a2020;
    --edge: #000;
    --red: #781e14;
    --red-hover: #9c2c1f;
    --red-active: #b5331f;
    --cream: #f5e2ce;
    --text: #ffffff;
    --muted: #a8968a;
    --radius: 18px;
    --tile-size: 84px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(1100px 700px at 30% -10%, #3a110c 0%, var(--bg) 62%) fixed, var(--bg);
    color: var(--text);
    font-family: "Dazzle Unicase", system-ui, sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    min-height: 100vh;
  }
  /* Dazzle Unicase draws lowercase e round, so every label must really be uppercase.
     Browsers give form controls text-transform: none; make them follow body. */
  button, select, input { font: inherit; color: inherit; text-transform: inherit; }
  /* Cream fill with a black outline, like the in-game buttons and titles. */
  .outlined, .btn, .roles button[aria-pressed="true"], .tabs button[aria-selected="true"], .section-title {
    color: var(--cream);
    paint-order: stroke fill;
    -webkit-text-stroke: 4px #000;
  }
  header {
    max-width: 1180px; margin: 0 auto; padding: 28px 16px 8px;
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  h1 { margin: 0; font-size: clamp(28px, 5vw, 46px); letter-spacing: 0.03em; font-weight: 700; -webkit-text-stroke-width: 6px; }
  h1 span { color: var(--red-active); }

  main {
    max-width: 1180px; margin: 0 auto; padding: 12px 16px 48px;
    display: grid; grid-template-columns: minmax(280px, 520px) minmax(0, 1fr); gap: 24px; align-items: start;
  }
  @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } }

  /* Preview */
  .preview { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 12px; }
  @media (max-width: 860px) { .preview { position: static; } }
  .stage {
    position: relative; aspect-ratio: 1; width: 100%;
    border-radius: var(--radius); overflow: hidden; border: 3px solid var(--edge);
    background-color: #1d1717;
    background-image: linear-gradient(45deg, #261e1e 25%, transparent 25%), linear-gradient(-45deg, #261e1e 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #261e1e 75%), linear-gradient(-45deg, transparent 75%, #261e1e 75%);
    background-size: 24px 24px; background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    transition: border-radius 0.25s ease;
  }
  .stage.circle { border-radius: 50%; }
  .stage canvas { width: 100%; height: 100%; display: block; }
  .stage .loading {
    position: absolute; inset: auto 12px 12px auto; padding: 4px 12px; border-radius: 99px;
    background: rgba(0,0,0,0.7); font-size: 14px; color: var(--cream); opacity: 0; transition: opacity 0.2s;
  }
  .stage .loading.on { opacity: 1; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  /* Pill buttons: button_normal / button_hover / good_guy_button_focus. */
  .btn {
    border: 2px solid var(--edge); background: var(--red); border-radius: 100px;
    padding: 10px 18px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 20px; letter-spacing: 0.03em; white-space: nowrap;
    transition: background 0.12s, transform 0.05s;
  }
  .btn:hover { background: var(--red-hover); }
  .btn:focus-visible { background: var(--red-active); outline: 2px solid var(--cream); outline-offset: 2px; }
  .btn:active { transform: translateY(1px); }
  .btn svg { flex-shrink: 0; width: 20px; height: 20px; stroke: var(--cream); filter: drop-shadow(0 0 1px #000) drop-shadow(0 0 1px #000); }
  .btn.small { font-size: 15px; padding: 5px 14px; -webkit-text-stroke-width: 3px; }
  .options { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; color: var(--cream); font-size: 15px; }
  .options label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .options input[type="checkbox"] { accent-color: var(--red-active); width: 16px; height: 16px; }
  .options select { background: var(--red); color: var(--cream); border: 2px solid var(--edge); border-radius: 100px; padding: 3px 8px; font: inherit; }
  .toast { color: var(--cream); font-size: 15px; min-height: 1.2em; }

  /* Editor */
  .editor { background: var(--panel); border: 2px solid var(--edge); border-radius: var(--radius); overflow: hidden; min-width: 0; }
  .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; border-bottom: 2px solid var(--edge); }
  .roles button {
    border: 2px solid var(--edge); background: #241c1c; border-radius: 100px; padding: 10px; cursor: pointer;
    font-size: 22px; letter-spacing: 0.04em; color: var(--muted);
  }
  .roles button:hover { background: var(--red-hover); color: var(--cream); }
  .roles button[aria-pressed="true"] { background: var(--red-active); }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 10px 0; }
  .tabs button {
    flex: 0 0 auto; border: 2px solid var(--edge); background: #241c1c; border-radius: 100px;
    padding: 6px 14px; cursor: pointer; color: var(--muted); font-size: 16px;
  }
  .tabs button:hover { color: var(--cream); background: var(--red-hover); }
  .tabs button[aria-selected="true"] { background: var(--red); -webkit-text-stroke-width: 3px; }
  .tabs button:disabled { opacity: 0.3; cursor: not-allowed; background: #241c1c; color: var(--muted); }
  .panel { padding: 14px 12px 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tile-size), 1fr)); gap: 8px; }
  .grid.rooms { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); }
  .tile {
    position: relative; aspect-ratio: 1; border-radius: 14px; border: 2px solid var(--edge); background: var(--tile);
    padding: 6px; cursor: pointer; display: grid; place-items: center; overflow: hidden;
    transition: background 0.12s, box-shadow 0.12s;
  }
  .tile:hover { background: var(--tile-hover); }
  .tile[aria-pressed="true"] { background: #3a1510; box-shadow: inset 0 0 0 3px var(--red-active); }
  .tile img, .tile canvas { max-width: 100%; max-height: 100%; object-fit: contain; display: block; pointer-events: none; }
  .tile .none { color: var(--muted); font-size: 14px; text-align: center; line-height: 1.1; }
  .tile.photo { padding: 0; }
  .tile.photo img { width: 100%; height: 100%; max-width: none; max-height: none; object-fit: cover; }
  .tile.photo[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--red-active); }
  .tile .label {
    position: absolute; inset: auto 0 0 0; font-size: 12px; padding: 3px 4px; background: rgba(0,0,0,0.72);
    color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center;
  }
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 10px; }
  .swatch {
    aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--edge); cursor: pointer;
    transition: box-shadow 0.12s, transform 0.1s;
  }
  .swatch:hover { transform: scale(1.06); }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--red-active); }
  .section-title { margin: 6px 4px 10px; font-size: 18px; -webkit-text-stroke-width: 3px; }
  .grid + .section-title, .swatches + .section-title { margin-top: 20px; }
  .slider { display: grid; grid-template-columns: 90px 1fr; gap: 12px; align-items: center; margin: 10px 4px 18px; }
  .slider > span { font-size: 18px; color: var(--cream); }
  .slider input { width: 100%; accent-color: var(--red-active); }
  .slider .ticks { grid-column: 2; display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-top: -10px; }
  .error { padding: 24px; color: var(--cream); line-height: 1.5; }
  .error code { background: #241c1c; padding: 2px 6px; border-radius: 6px; font-family: ui-monospace, monospace; font-weight: 400; }
  /* Framing: bust / tall hat / full body. */
  .framing { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .framing button {
    border: 2px solid var(--edge); background: #241c1c; border-radius: 100px; padding: 6px 8px; cursor: pointer;
    color: var(--muted); font-size: 15px; white-space: nowrap;
  }
  .framing button:hover { background: var(--red-hover); color: var(--cream); }
  .framing button[aria-pressed="true"] { background: var(--red); color: var(--cream); paint-order: stroke fill; -webkit-text-stroke: 3px #000; }
  /* Characters in the picture (group photo). */
  /* Padding leaves room for the active chip's ring (a box-shadow), which the
     scrolling row would otherwise clip. */
  .members { display: flex; gap: 12px; padding: 12px 14px 6px; align-items: center; overflow-x: auto; scrollbar-width: none; }
  .members::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; width: 58px; height: 58px; border-radius: 50%; border: 2px solid var(--edge); background: #241c1c;
    padding: 0; overflow: hidden; cursor: pointer; display: grid; place-items: center; font-size: 26px; color: var(--cream);
  }
  .chip canvas { width: 100%; height: 100%; display: block; }
  .chip[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--red-active); }
  .chip.add, .chip.remove { width: 44px; height: 44px; background: var(--red); paint-order: stroke fill; -webkit-text-stroke: 3px #000; }
  .chip.remove { background: #241c1c; }
  .grid.poses { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
  .grid.poses .tile { padding: 0; }
  .grid.poses canvas { width: 100%; height: 100%; }

  /* ---------- Phones ---------- */
  button, select, label, input { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .short { display: none; }
  @media (max-width: 860px) {
    :root { --tile-size: 68px; }
    header { padding: 14px 12px 4px; }
    h1 { font-size: clamp(20px, 6.2vw, 30px); -webkit-text-stroke-width: 5px; }
    main { padding: 4px 12px calc(32px + env(safe-area-inset-bottom)); gap: 12px; }
    .actions > * { min-width: 0; }
    .btn { font-size: 17px; padding: 10px 12px; min-height: 46px; }
    .btn.small { font-size: 14px; min-height: 34px; padding: 4px 12px; }
    .options { font-size: 13px; gap: 6px 10px; justify-content: center; flex-wrap: nowrap; }
    .options label { gap: 4px; }
    .options select { padding: 2px 4px; }
    .options input[type="checkbox"] { width: 18px; height: 18px; }
    .options select { min-height: 32px; }
    .long { display: none; }
    .short { display: inline; }
    .roles { padding: 8px; gap: 6px; }
    .roles button { font-size: 18px; padding: 8px; min-height: 44px; }
    /* One swipeable row of tabs instead of three wrapped lines. */
    .tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: 8px 8px 2px; scroll-snap-type: x proximity; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs button { min-height: 40px; padding: 6px 14px; font-size: 15px; flex-shrink: 0; scroll-snap-align: start; }
    .panel { padding: 12px 8px 14px; }
    .grid { gap: 6px; }
    .grid.rooms { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
    .swatches { grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 10px; }
    .framing button { font-size: 13px; padding: 5px 6px; min-height: 34px; }
    .grid.poses { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); }
    .slider { grid-template-columns: 76px 1fr; }
    .slider input { height: 32px; }
  }
  /* Landscape phones: picture + buttons pinned on the left, options on the right. */
  @media (max-height: 559px) and (min-width: 560px) {
    header { padding: 8px 12px 2px; }
    h1 { font-size: 22px; }
    main { grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding-top: 4px; }
    .preview { position: sticky; top: 8px; width: calc(100svh - 160px); min-width: 210px; gap: 6px; }
    .actions { gap: 6px; }
    .btn { font-size: 14px; padding: 6px 4px; min-height: 36px; }
    .btn svg { display: none; }
    .options { flex-wrap: wrap; font-size: 12px; gap: 4px 8px; }
    .toast:empty { display: none; }
  }
  @media (max-width: 360px) {
    .size-word, .btn svg { display: none; }
    .options { gap: 6px 8px; font-size: 12px; }
  }
  /* Tall phones: keep the picture pinned while the options scroll underneath. */
  @media (max-width: 860px) and (min-height: 560px) {
    .preview {
      position: sticky; top: 0; z-index: 5;
      margin: 0 -12px; padding: 8px 12px 10px;
      background: var(--bg);
      box-shadow: 0 10px 18px -8px rgba(0, 0, 0, 0.85);
      gap: 8px;
    }
    .stage { width: min(100%, 34svh); margin: 0 auto; border-radius: 14px; }
    .stage.circle { border-radius: 50%; }
    .actions { width: min(100%, 420px); margin: 0 auto; }
    .toast:empty { display: none; }
    /* Tabs pin right under the preview (--pin-h is measured in script).
       overflow: clip, unlike hidden, doesn't make the editor a scroll container. */
    .editor { overflow: clip; }
    .tabs { position: sticky; top: var(--pin-h, 0px); z-index: 4; background: #191515; padding-bottom: 8px; }
  }
</style>
</head>
<body>
<header>
  <h1 class="outlined">Haunted Heist <span>Avatar Maker</span></h1>
</header>
<main>
  <section class="preview" aria-label="Preview">
    <div class="stage" id="stage">
      <canvas id="canvas" width="1024" height="1024" aria-label="Your avatar"></canvas>
      <div class="loading" id="loading">Loading…</div>
    </div>
    <div class="actions">
      <button class="btn" id="randomize" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
        Randomize
      </button>
      <button class="btn primary" id="download" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        Download
      </button>
    </div>
    <div class="framing" id="framing" role="group" aria-label="Framing"></div>
    <div class="options">
      <label><input type="checkbox" id="circle"> Circle<span class="long"> preview</span></label>
      <label><input type="checkbox" id="soft" checked> Soft<span class="long"> room</span></label>
      <label><span class="size-word">Size</span>
        <select id="size" aria-label="Download size">
          <option value="256">256</option>
          <option value="512" selected>512</option>
          <option value="1024">1024</option>
        </select>
      </label>
      <button class="btn small" id="share" type="button"><span class="long">Copy </span>Link</button>
    </div>
    <div class="toast" id="toast" role="status"></div>
  </section>

  <section class="editor" aria-label="Customize">
    <div class="members" id="members" aria-label="Characters in the picture"></div>
    <div class="roles" id="roles"></div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="panel" id="panel"></div>
  </section>
</main>

<script>
(() => {
  const LAYERS = "layers/";
  const ROLE_LABELS = { heister: "Heister", trickster: "Trickster" };
  const TABS = [
    { id: "outfit", label: "Outfit" },
    { id: "face", label: "Face" },
    { id: "hat", label: "Hat" },
    { id: "color", label: "Color" },
    { id: "body", label: "Body" },
    { id: "pose", label: "Pose" },
    { id: "background", label: "Background" },
  ];
  const FRAMINGS = [
    { id: "bust", label: "Bust" },
    { id: "tall", label: "Tall hat" },
    { id: "full", label: "Full body" },
  ];
  const MAX_MEMBERS = 4;
  const BACKGROUNDS = [
    { id: "none", label: "None" },
    { id: "mansion", label: "Mansion", stops: ["#4a3560", "#16101e"] },
    { id: "blood", label: "Blood", stops: ["#9c2a22", "#2a0806"] },
    { id: "moss", label: "Moss", stops: ["#4f6a2a", "#141b0a"] },
    { id: "ectoplasm", label: "Ectoplasm", stops: ["#3fb7a0", "#0a2a2a"] },
    { id: "candle", label: "Candle", stops: ["#f0c070", "#6a3510"] },
    { id: "midnight", label: "Midnight", stops: ["#2c3f7a", "#070b1c"] },
    { id: "bone", label: "Bone", color: "#e9e0cc" },
    { id: "pumpkin", label: "Pumpkin", color: "#e0742a" },
    { id: "ink", label: "Ink", color: "#0d0b10" },
    { id: "gem", label: "Gem", color: "#c23a8a" },
    { id: "slime", label: "Slime", color: "#7ad13a" },
  ];

  const $ = (id) => document.getElementById(id);
  const canvas = $("canvas");
  const ctx = canvas.getContext("2d");
  let manifest = null;
  let rooms = []; // from layers/backgrounds/backgrounds.json (BenchTools/pfp_room_bake.tscn)
  let roomsBaked = 0;
  let tab = "outfit";
  // The picture: one or more characters ("members") in a shared scene.
  const scene = { members: [], active: 0, bg: "mansion", framing: "bust" };

  // ---------- data helpers ----------
  const prettify = (name, r) => name
    .replace(new RegExp("^" + r + "_", "i"), "")
    .replace(/_(outfit|hat|face|static_face)$/i, "")
    .replace(/_/g, " ")
    .replace(/\b\w/g, (c) => c.toUpperCase());
  const S = () => scene.members[scene.active];
  const roleOf = (m = S()) => manifest.roles[m.role];
  const poseOf = (m = S()) => roleOf(m).poses[m.pose] || roleOf(m).poses.idle;
  const outfitOf = (m = S()) => poseOf(m).outfits.find((o) => o.id === m.outfit) || poseOf(m).outfits[0];
  const hatOf = (m = S()) => poseOf(m).hats.find((h) => h.id === m.hat) || null;
  const stepKey = (shape, weight) => `s${Math.round(shape * 100)}_w${Math.round(weight * 100)}`;
  const nearest = (steps, v) => steps.reduce((a, b) => Math.abs(b - v) < Math.abs(a - v) ? b : a, steps[0]);
  const colorHex = (m) => "#" + (roleOf(m).colors.find((c) => c.id === m.color) || roleOf(m).colors[0]).hex;

  function newMember(r) {
    const d = manifest.roles[r];
    return { role: r, outfit: d.default_outfit, face: d.default_face, hat: d.no_hat, style: 0, color: d.colors[0].id, shape: 0, weight: 0, pose: "idle" };
  }

  function clamp(m) {
    const d = roleOf(m);
    if (!d.poses[m.pose]) m.pose = "idle";
    if (!poseOf(m).outfits.some((o) => o.id === m.outfit)) m.outfit = d.default_outfit;
    const o = outfitOf(m);
    m.shape = nearest(o.shape_steps, m.shape);
    m.weight = nearest(o.weight_steps, m.weight);
    const h = hatOf(m);
    if (h && m.style >= h.styles.length) m.style = 0;
  }

  // Parts of one character: { e (layer entry), tint (hex|null), front (bool) }.
  function parts(m) {
    const r = roleOf(m);
    const o = outfitOf(m);
    const v = o.variants[stepKey(m.shape, m.weight)] || Object.values(o.variants)[0];
    // Like PlayerAnimation.apply_character_color: a static-color outfit keeps its body,
    // but skin-colored head accessories still take the body color.
    const color = colorHex(m);
    const hat = o.allows_hats && m.hat !== r.no_hat ? hatOf(m) : null;
    const bodies = hat ? (hat.styles[m.style] || hat.styles[0]).bodies : null;
    const hl = bodies ? (bodies[o.big_body ? "big" : "normal"] || bodies.normal || Object.values(bodies)[0]) : null;
    const faces = v.faces || {};
    const face = faces[o.face_locked ? String(o.locked_face) : String(m.face)];
    const list = [];
    if (v.skin) list.push({ e: v.skin, tint: o.static_color ? null : color });
    if (v.clothes) list.push({ e: v.clothes });
    if (v.nohat && !hat) list.push({ e: v.nohat }); // hoods/helmets hide under a hat
    if (face) list.push({ e: face, front: !!o.face_on_top });
    if (hl && hl.hat_skin) list.push({ e: hl.hat_skin, tint: hat.skin_tinted ? color : null });
    if (hl && hl.hat) list.push({ e: hl.hat });
    return list;
  }

  // ---------- images ----------
  const images = new Map();
  function loadImage(file) {
    if (!images.has(file)) {
      images.set(file, new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("Missing " + file));
        // Bake stamps bust caches: re-baked layers keep their file names.
        const baked = file.startsWith("backgrounds/") ? roomsBaked : manifest.baked;
        img.src = LAYERS + file + (baked ? "?v=" + baked : "");
      }));
    }
    return images.get(file);
  }
  const toLinear = new Float32Array(256).map((_, i) => {
    const c = i / 255;
    return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  });
  // Linear -> sRGB byte through a 4096-entry table (fast enough per pixel).
  const SRGB_LUT = new Uint8ClampedArray(4097).map((_, i) => {
    const l = i / 4096;
    return Math.round((l <= 0.0031308 ? l * 12.92 : 1.055 * Math.pow(l, 1 / 2.4) - 0.055) * 255);
  });
  const toSrgb = (l) => SRGB_LUT[l <= 0 ? 0 : l >= 1 ? 4096 : (l * 4096) | 0];
  const hexLinear = (hex) => [1, 3, 5].map((i) => toLinear[parseInt(hex.slice(i, i + 2), 16)]);

  function canvasOf(img) {
    const c = document.createElement("canvas");
    c.width = img.naturalWidth || img.width; c.height = img.naturalHeight || img.height;
    c.getContext("2d", { willReadFrequently: true }).drawImage(img, 0, 0);
    return c;
  }
  // Tintable parts are baked at 50% grey (img) and black (base) body colour; the toon
  // shader is linear in its colour, so any colour c is base + 2 * (grey - base) * c in
  // linear light. That also respects the shader's colour mask.
  const tintCache = new Map();
  async function tinted(e, hex) {
    const key = e.file + hex;
    if (!tintCache.has(key)) {
      tintCache.set(key, (async () => {
        const [img, base] = await Promise.all([loadImage(e.file), e.base ? loadImage(e.base) : null]);
        const c = canvasOf(img);
        const g = c.getContext("2d", { willReadFrequently: true });
        const out = g.getImageData(0, 0, c.width, c.height);
        const w = out.data;
        const b = base ? canvasOf(base).getContext("2d").getImageData(0, 0, c.width, c.height).data : null;
        const rgb = hexLinear(hex);
        for (let i = 0; i < w.length; i += 4) {
          if (w[i + 3] === 0) continue;
          for (let ch = 0; ch < 3; ch++) {
            const lg = toLinear[w[i + ch]];
            const lb = b ? toLinear[b[i + ch]] : 0;
            w[i + ch] = toSrgb(lb + 2 * (lg - lb) * rgb[ch]);
          }
        }
        g.putImageData(out, 0, 0);
        return c;
      })());
    }
    return tintCache.get(key);
  }
  // See-through tinted parts (goo): per-channel transmission tk + 2 * (tg - tk) * c, x255.
  const glassCache = new Map();
  async function glassMap(e, hex) {
    const key = e.glass + hex;
    if (!glassCache.has(key)) {
      glassCache.set(key, (async () => {
        const [tg, tk] = await Promise.all([loadImage(e.glass), loadImage(e.glass_base)]);
        const c = canvasOf(tg);
        const g = c.getContext("2d", { willReadFrequently: true });
        const out = g.getImageData(0, 0, c.width, c.height);
        const a = out.data;
        const k = canvasOf(tk).getContext("2d").getImageData(0, 0, c.width, c.height).data;
        const rgb = hexLinear(hex);
        for (let i = 0; i < a.length; i += 4) {
          for (let ch = 0; ch < 3; ch++) a[i + ch] = Math.max(0, Math.min(255, k[i + ch] + 2 * (a[i + ch] - k[i + ch]) * rgb[ch]));
          a[i + 3] = 255;
        }
        g.putImageData(out, 0, 0);
        return c;
      })());
    }
    return glassCache.get(key);
  }

  // ---------- scene layout ----------
  // World units are metres with the floor at 0. Every role's bake has its own pixel
  // scale (frame.px_per_m), so heisters and tricksters share one real-world scale.
  const headHeight = (r) => (r.frame.feet_y - r.frame.head_y) / r.frame.px_per_m;
  function sceneBox(members, framing) {
    const head = Math.max(...members.map((m) => headHeight(roleOf(m))));
    // Spacing leaves room for spread arms (flex, tpose); full body also keeps a margin under the feet.
    const spacing = framing === "full" ? 1.0 : 0.8;
    const groupWidth = (members.length - 1) * spacing + (framing === "full" ? 1.8 : 1.3);
    let top, side;
    if (framing === "full") { top = head + 1.25; side = top + 0.2; }
    else if (framing === "tall") { top = head + 1.2; side = 1.75; }
    else { top = head + 0.7; side = 1.24; }
    // A wide group widens the square; spread the extra height evenly above and
    // below so the characters stay centred instead of hugging the top.
    const wide = Math.max(side, groupWidth);
    top += (wide - side) / 2;
    return { top, side: wide, spacing };
  }

  // ---------- compositing ----------
  // Draws a source image into a w x h window of the output (smooth for colour, nearest
  // for depth) and returns its pixels.
  function scaledPixels(src, dx, dy, dw, dh, rx, ry, rw, rh, smooth) {
    const c = document.createElement("canvas");
    c.width = rw; c.height = rh;
    const g = c.getContext("2d", { willReadFrequently: true });
    g.imageSmoothingEnabled = smooth;
    g.imageSmoothingQuality = "high";
    g.drawImage(src, dx - rx, dy - ry, dw, dh);
    return g.getImageData(0, 0, rw, rh).data;
  }

  async function paintBackground(g, size, bgId) {
    g.clearRect(0, 0, size, size);
    const room = rooms.find((r) => r.id === bgId);
    if (room) {
      const img = await loadImage(room.file);
      // Soft focus keeps the character readable against a busy room.
      const soft = $("soft").checked;
      if (soft) g.filter = `blur(${Math.round(size / 220)}px)`;
      const pad = soft ? size * 0.02 : 0;
      g.drawImage(img, -pad, -pad, size + pad * 2, size + pad * 2);
      g.filter = "none";
      const vignette = g.createRadialGradient(size / 2, size * 0.45, size * 0.25, size / 2, size * 0.5, size * 0.75);
      vignette.addColorStop(0, "rgba(0,0,0,0)");
      vignette.addColorStop(1, soft ? "rgba(0,0,0,0.55)" : "rgba(0,0,0,0.35)");
      g.fillStyle = vignette; g.fillRect(0, 0, size, size);
      return;
    }
    const bg = BACKGROUNDS.find((b) => b.id === bgId) || BACKGROUNDS[0];
    if (bg.color) { g.fillStyle = bg.color; g.fillRect(0, 0, size, size); }
    if (bg.stops) {
      const grad = g.createRadialGradient(size / 2, size * 0.42, size * 0.05, size / 2, size * 0.5, size * 0.75);
      grad.addColorStop(0, bg.stops[0]);
      grad.addColorStop(1, bg.stops[1]);
      g.fillStyle = grad; g.fillRect(0, 0, size, size);
    }
  }

  // Stacks one character's parts per pixel by depth, straight onto the background
  // (so see-through parts pass the real background through).
  async function compositeMember(g, size, m, box, index, count) {
    const r = roleOf(m);
    const f = r.frame;
    const pxPerM = size / box.side;
    const k = pxPerM / f.px_per_m;
    const cx = size / 2 + (index - (count - 1) / 2) * box.spacing * pxPerM;
    const groundY = box.top * pxPerM;
    const list = parts(m);
    const loaded = await Promise.all(list.map(async (p) => ({
      p,
      color: p.tint ? await tinted(p.e, p.tint) : await loadImage(p.e.file),
      depth: await loadImage(p.e.depth),
      glass: p.tint && p.e.glass ? await glassMap(p.e, p.tint) : null,
    })));
    // Each part's window on the output.
    const layers = [];
    let bx0 = size, by0 = size, bx1 = 0, by1 = 0;
    for (const L of loaded) {
      const e = L.p.e;
      const dx = cx + (e.x - f.head_x) * k, dy = groundY - (f.feet_y - e.y) * k;
      const dw = e.w * k, dh = e.h * k;
      const x0 = Math.max(0, Math.floor(dx)), y0 = Math.max(0, Math.floor(dy));
      const x1 = Math.min(size, Math.ceil(dx + dw)), y1 = Math.min(size, Math.ceil(dy + dh));
      if (x1 <= x0 || y1 <= y0) continue;
      layers.push({ L, dx, dy, dw, dh, x0, y0, x1, y1 });
      bx0 = Math.min(bx0, x0); by0 = Math.min(by0, y0); bx1 = Math.max(bx1, x1); by1 = Math.max(by1, y1);
    }
    if (!layers.length) return;
    const W = bx1 - bx0, H = by1 - by0;
    for (const l of layers) {
      l.col = scaledPixels(l.L.color, l.dx, l.dy, l.dw, l.dh, bx0, by0, W, H, true);
      l.z = scaledPixels(l.L.depth, l.dx, l.dy, l.dw, l.dh, bx0, by0, W, H, false);
      l.t = l.L.glass ? scaledPixels(l.L.glass, l.dx, l.dy, l.dw, l.dh, bx0, by0, W, H, true) : null;
      l.front = !!l.L.p.front;
    }
    const outImg = g.getImageData(bx0, by0, W, H);
    const o = outImg.data;
    const n = layers.length;
    const order = new Int32Array(n), dep = new Float64Array(n);
    for (let i = 0; i < o.length; i += 4) {
      let cnt = 0;
      for (let j = 0; j < n; j++) {
        const L = layers[j];
        if (L.col[i + 3] === 0) continue;
        const d = L.z[i] * 256 + L.z[i + 1];
        if (d === 0) continue;
        dep[cnt] = L.front ? 0 : d; order[cnt++] = j;
      }
      if (cnt === 0) continue;
      // Far to near (insertion sort; a handful of parts per pixel).
      for (let a = 1; a < cnt; a++) {
        const dj = dep[a], oj = order[a];
        let b = a - 1;
        while (b >= 0 && dep[b] < dj) { dep[b + 1] = dep[b]; order[b + 1] = order[b]; b--; }
        dep[b + 1] = dj; order[b + 1] = oj;
      }
      let r0 = toLinear[o[i]], g0 = toLinear[o[i + 1]], b0 = toLinear[o[i + 2]];
      for (let a = 0; a < cnt; a++) {
        const L = layers[order[a]];
        const al = L.col[i + 3] / 255;
        const pr = toLinear[L.col[i]] * al, pg = toLinear[L.col[i + 1]] * al, pb = toLinear[L.col[i + 2]] * al;
        if (L.t) {
          r0 = pr + (L.t[i] / 255) * r0; g0 = pg + (L.t[i + 1] / 255) * g0; b0 = pb + (L.t[i + 2] / 255) * b0;
        } else {
          r0 = pr + (1 - al) * r0; g0 = pg + (1 - al) * g0; b0 = pb + (1 - al) * b0;
        }
      }
      o[i] = toSrgb(r0); o[i + 1] = toSrgb(g0); o[i + 2] = toSrgb(b0); o[i + 3] = Math.max(o[i + 3], 255);
    }
    g.putImageData(outImg, bx0, by0);
  }

  async function composeScene(g, size, members = scene.members, framing = scene.framing, bg = scene.bg) {
    await paintBackground(g, size, bg);
    const box = sceneBox(members, framing);
    for (let i = 0; i < members.length; i++) await compositeMember(g, size, members[i], box, i, members.length);
  }

  let drawToken = 0;
  async function render() {
    const token = ++drawToken;
    const loading = setTimeout(() => $("loading").classList.add("on"), 150);
    const off = document.createElement("canvas");
    off.width = off.height = canvas.width;
    try {
      await composeScene(off.getContext("2d", { willReadFrequently: true }), canvas.width);
      if (token !== drawToken) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(off, 0, 0);
    } catch (err) {
      console.error(err);
      toast("Couldn't load part of this look.");
    } finally {
      clearTimeout(loading);
      if (token === drawToken) $("loading").classList.remove("on");
    }
    writeHash();
  }

  // ---------- UI ----------
  function el(tag, attrs = {}, children = []) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v;
      else if (k === "on") for (const [ev, fn] of Object.entries(v)) n.addEventListener(ev, fn);
      else if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v === true ? "" : v);
    }
    for (const c of [].concat(children)) if (c != null) n.append(c);
    return n;
  }

  function tile({ pressed, title, onClick, content, label, photo }) {
    return el("button", { type: "button", class: photo ? "tile photo" : "tile", "aria-pressed": String(!!pressed), title, on: { click: onClick } },
      [content, label ? el("span", { class: "label" }, label) : null]);
  }

  function iconImg(path, alt) {
    return path ? el("img", { src: LAYERS + path, alt, loading: "lazy" }) : el("span", { class: "none" }, alt);
  }

  // Faces have no icon: crop the face layer onto a small skin-colored chip.
  function faceThumb(entry) {
    const c = el("canvas", { width: 96, height: 96 });
    loadImage(entry.file).then((img) => {
      const g = c.getContext("2d");
      const scale = Math.min(88 / img.naturalWidth, 88 / img.naturalHeight);
      const w = img.naturalWidth * scale, h = img.naturalHeight * scale;
      g.fillStyle = colorHex(S());
      g.beginPath(); g.arc(48, 48, 46, 0, Math.PI * 2); g.fill();
      g.drawImage(img, (96 - w) / 2, (96 - h) / 2, w, h);
    }).catch(() => {});
    return c;
  }

  // Live mini-render of a character (pose tiles, character chips).
  function memberThumb(m, size, framing) {
    const c = el("canvas", { width: size, height: size });
    const g = c.getContext("2d", { willReadFrequently: true });
    composeScene(g, size, [m], framing, "none").catch(() => {});
    return c;
  }

  function set(patch) {
    Object.assign(S(), patch);
    clamp(S());
    renderUI();
    render();
  }

  function renderMembers() {
    const box = $("members");
    const chips = scene.members.map((m, i) => el("button", {
      type: "button", class: "chip", "aria-pressed": String(i === scene.active), title: `Character ${i + 1}`,
      "aria-label": `Edit character ${i + 1}`,
      on: { click: () => { scene.active = i; renderUI(); } },
    }, memberThumb(m, 64, "bust")));
    if (scene.members.length < MAX_MEMBERS) {
      chips.push(el("button", {
        type: "button", class: "chip add", title: "Add a character", "aria-label": "Add a character",
        on: { click: () => {
          // New characters start as the default look of the current role, in the same pose.
          const m = Object.assign(newMember(S().role), { pose: S().pose });
          scene.members.push(m); scene.active = scene.members.length - 1; clamp(m);
          renderUI(); render();
        } },
      }, "+"));
    }
    if (scene.members.length > 1) {
      chips.push(el("button", {
        type: "button", class: "chip remove", title: "Remove this character", "aria-label": "Remove this character",
        on: { click: () => {
          scene.members.splice(scene.active, 1);
          scene.active = Math.min(scene.active, scene.members.length - 1);
          renderUI(); render();
        } },
      }, "×"));
    }
    box.replaceChildren(...chips);
  }

  function renderRoles() {
    const box = $("roles");
    box.replaceChildren(...Object.keys(manifest.roles).map((r) =>
      el("button", { type: "button", "aria-pressed": String(r === S().role), on: { click: () => {
        if (r === S().role) return;
        const pose = S().pose;
        scene.members[scene.active] = Object.assign(newMember(r), { pose });
        clamp(S()); renderUI(); render();
      } } }, ROLE_LABELS[r] || r)));
  }

  function renderFraming() {
    $("framing").replaceChildren(...FRAMINGS.map((fr) => el("button", {
      type: "button", "aria-pressed": String(fr.id === scene.framing),
      on: { click: () => { scene.framing = fr.id; renderFraming(); render(); } },
    }, fr.label)));
  }

  function renderTabs() {
    const o = outfitOf();
    const hat = o.allows_hats && S().hat !== roleOf().no_hat ? hatOf() : null;
    const disabled = {
      face: o.face_locked,
      hat: !o.allows_hats,
      // Static-color outfits only recolor skin-colored head accessories.
      color: o.static_color && !(hat && hat.skin_tinted),
      body: o.shape_steps.length < 2 && o.weight_steps.length < 2,
      pose: (roleOf().pose_order || []).length < 2,
    };
    if (disabled[tab]) tab = "outfit";
    $("tabs").replaceChildren(...TABS.map((t) => el("button", {
      type: "button", role: "tab", "aria-selected": String(t.id === tab), disabled: !!disabled[t.id],
      title: disabled[t.id] ? "This outfit doesn't use this" : undefined,
      on: { click: () => { tab = t.id; renderUI(); } },
    }, t.label)));
  }

  function renderPanel() {
    const r = roleOf(), m = S(), o = outfitOf(), pose = poseOf();
    const panel = $("panel");
    const nodes = [];
    if (tab === "outfit") {
      nodes.push(el("div", { class: "grid" }, pose.outfits.map((x) => tile({
        pressed: x.id === m.outfit, title: "Outfit",
        content: iconImg(x.icon, "Outfit"),
        onClick: () => set({ outfit: x.id }),
      }))));
    } else if (tab === "face") {
      const v = o.variants[stepKey(m.shape, m.weight)];
      nodes.push(el("div", { class: "grid" }, r.faces.filter((f) => v.faces && v.faces[f.id]).map((f) => tile({
        pressed: f.id === m.face, title: prettify(f.name, m.role),
        content: faceThumb(v.faces[f.id]),
        onClick: () => set({ face: f.id }),
      }))));
    } else if (tab === "hat") {
      const tiles = [tile({ pressed: m.hat === r.no_hat, title: "No hat", content: el("span", { class: "none" }, "No hat"), onClick: () => set({ hat: r.no_hat, style: 0 }) })];
      for (const h of pose.hats) tiles.push(tile({
        pressed: h.id === m.hat, title: prettify(h.name, m.role),
        content: iconImg(h.icon || (h.styles[0] && h.styles[0].icon), prettify(h.name, m.role)),
        onClick: () => set({ hat: h.id, style: 0 }),
      }));
      nodes.push(el("div", { class: "grid" }, tiles));
      const h = hatOf();
      if (h && h.styles.length > 1 && m.hat !== r.no_hat) {
        nodes.push(el("div", { class: "section-title" }, "Style"));
        nodes.push(el("div", { class: "grid" }, h.styles.map((st, i) => tile({
          pressed: i === m.style, title: `Style ${i + 1}`,
          content: iconImg(st.icon, `Style ${i + 1}`),
          onClick: () => set({ style: i }),
        }))));
      }
    } else if (tab === "color") {
      nodes.push(el("div", { class: "swatches" }, r.colors.map((c) => el("button", {
        type: "button", class: "swatch", style: `background:#${c.hex}`, title: "#" + c.hex, "aria-label": "Color #" + c.hex,
        "aria-pressed": String(c.id === m.color), on: { click: () => set({ color: c.id }) },
      }))));
    } else if (tab === "body") {
      const slider = (label, key, steps) => {
        if (steps.length < 2) return null;
        const input = el("input", { type: "range", min: 0, max: steps.length - 1, step: 1, value: steps.indexOf(m[key]), "aria-label": label });
        input.addEventListener("input", () => { S()[key] = steps[+input.value]; render(); });
        input.addEventListener("change", () => renderMembers());
        return el("div", { class: "slider" }, [el("span", {}, label), input,
          el("div", { class: "ticks" }, steps.map((v) => el("span", {}, v === 0 ? "Min" : v === 1 ? "Max" : "Mid")))]);
      };
      nodes.push(slider("Shape", "shape", o.shape_steps));
      nodes.push(slider("Weight", "weight", o.weight_steps));
    } else if (tab === "pose") {
      nodes.push(el("div", { class: "grid poses" }, (r.pose_order || ["idle"]).filter((p) => r.poses[p]).map((p) => {
        const preview = Object.assign({}, m, { pose: p });
        clamp(preview);
        return tile({
          pressed: p === m.pose, title: p === "idle" ? "Idle" : prettify(p, ""),
          content: memberThumb(preview, 120, "full"),
          onClick: () => set({ pose: p }),
        });
      })));
    } else if (tab === "background") {
      if (rooms.length) {
        nodes.push(el("div", { class: "section-title" }, "Rooms"));
        nodes.push(el("div", { class: "grid rooms" }, rooms.map((rm) => tile({
          pressed: rm.id === scene.bg, photo: true,
          content: el("img", { src: LAYERS + rm.file + (roomsBaked ? "?v=" + roomsBaked : ""), alt: "Room", loading: "lazy" }),
          onClick: () => { scene.bg = rm.id; renderPanel(); render(); },
        }))));
        nodes.push(el("div", { class: "section-title" }, "Colors"));
      }
      nodes.push(el("div", { class: "swatches" }, BACKGROUNDS.map((b) => {
        const style = "background:" + (b.color || (b.stops ? `radial-gradient(circle at 50% 40%, ${b.stops[0]}, ${b.stops[1]})` : "repeating-conic-gradient(#3a3145 0 25%, #262030 0 50%) 50% / 14px 14px"));
        return el("button", { type: "button", class: "swatch", style, title: b.label, "aria-label": b.label + " background",
          "aria-pressed": String(b.id === scene.bg), on: { click: () => { scene.bg = b.id; renderPanel(); render(); } } });
      })));
    }
    panel.replaceChildren(...nodes.filter(Boolean));
  }

  function renderUI() {
    renderMembers();
    renderRoles();
    renderFraming();
    renderTabs();
    renderPanel();
  }

  // ---------- actions ----------
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  function randomize() {
    const m = S();
    const r = roleOf(m);
    const pose = poseOf(m);
    const o = pick(pose.outfits);
    const hatRoll = Math.random() < 0.25 ? r.no_hat : pick(pose.hats).id;
    const h = pose.hats.find((x) => x.id === hatRoll);
    Object.assign(m, {
      outfit: o.id,
      face: pick(r.faces).id,
      hat: hatRoll,
      style: h ? Math.floor(Math.random() * h.styles.length) : 0,
      color: pick(r.colors).id,
      shape: pick(o.shape_steps),
      weight: pick(o.weight_steps),
    });
    clamp(m);
    // Mostly rooms; the flat colors still turn up. "None" (transparent) is never rolled.
    scene.bg = rooms.length && Math.random() < 0.8 ? pick(rooms).id : pick(BACKGROUNDS.filter((b) => b.id !== "none")).id;
    renderUI();
    render();
  }

  async function download() {
    const size = +$("size").value;
    const out = document.createElement("canvas");
    out.width = out.height = size;
    await composeScene(out.getContext("2d", { willReadFrequently: true }), size);
    const name = `haunted-heist-${scene.members.length > 1 ? "group" : S().role}-${size}.png`;
    const blob = await new Promise((resolve) => out.toBlob(resolve, "image/png"));
    // Phones: the share sheet offers "Save Image" straight to Photos.
    const file = new File([blob], name, { type: "image/png" });
    if (matchMedia("(pointer: coarse)").matches && navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: "Haunted Heist avatar" });
        return;
      } catch (err) {
        if (err.name === "AbortError") return;
      }
    }
    const a = el("a", { href: URL.createObjectURL(blob), download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  let toastTimer;
  function toast(msg) {
    $("toast").textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $("toast").textContent = ""; }, 2500);
  }

  // Link: #m=<member>~<member>&bg=<id>&fr=<framing>, member = role.o.f.h.st.c.sh.w.pose
  // (older single-character links with r=&o=&... still open).
  const POSE_KEY = (p) => p.replace(/ /g, "_");
  function writeHash() {
    const enc = (m) => [m.role, m.outfit, m.face, m.hat, m.style, m.color, Math.round(m.shape * 100), Math.round(m.weight * 100), POSE_KEY(m.pose)].join(".");
    const p = new URLSearchParams({ m: scene.members.map(enc).join("~"), bg: scene.bg, fr: scene.framing });
    history.replaceState(null, "", "#" + p.toString());
  }
  function readHash() {
    const p = new URLSearchParams(location.hash.slice(1));
    const isBg = (id) => BACKGROUNDS.some((b) => b.id === id) || rooms.some((r) => r.id === id);
    if (isBg(p.get("bg"))) scene.bg = p.get("bg");
    if (FRAMINGS.some((f) => f.id === p.get("fr"))) scene.framing = p.get("fr");
    const members = [];
    if (p.has("m")) {
      for (const part of p.get("m").split("~").slice(0, MAX_MEMBERS)) {
        const [r, ...rest] = part.split(".");
        if (!manifest.roles[r]) continue;
        const nums = rest.slice(0, 8).map(Number);
        const m = newMember(r);
        const keys = ["outfit", "face", "hat", "style", "color", "shape", "weight"];
        keys.forEach((k, i) => { if (!isNaN(nums[i])) m[k] = (k === "shape" || k === "weight") ? nums[i] / 100 : nums[i]; });
        const pose = (rest[7] || "idle").replace(/_/g, " ");
        if (manifest.roles[r].poses[pose]) m.pose = pose;
        clamp(m); members.push(m);
      }
    } else if (p.has("r") && manifest.roles[p.get("r")]) {
      const m = newMember(p.get("r"));
      const n = (k, d) => (p.has(k) && !isNaN(+p.get(k)) ? +p.get(k) : d);
      Object.assign(m, { outfit: n("o", m.outfit), face: n("f", m.face), hat: n("h", m.hat), style: n("st", 0), color: n("c", m.color), shape: n("sh", 0) / 100, weight: n("w", 0) / 100 });
      clamp(m); members.push(m);
    }
    if (members.length) { scene.members = members; scene.active = 0; }
  }

  async function init() {
    try {
      const res = await fetch(LAYERS + "manifest.json", { cache: "no-cache" });
      if (!res.ok) throw new Error(res.status);
      manifest = await res.json();
    } catch (err) {
      $("panel").replaceChildren(el("div", { class: "error" }, [
        "Couldn't load ", el("code", {}, "layers/manifest.json"), ". Bake the layers with ",
        el("code", {}, "BenchTools/pfp_layer_bake.tscn"), " and serve this folder over http (",
        el("code", {}, "python -m http.server"), ").",
      ]));
      return;
    }
    try {
      const res = await fetch(LAYERS + "backgrounds/backgrounds.json", { cache: "no-cache" });
      if (res.ok) {
        const data = await res.json();
        rooms = data.rooms || [];
        roomsBaked = data.baked || 0;
      }
    } catch { /* room shots are optional */ }
    scene.members = [newMember(Object.keys(manifest.roles)[0])];
    if (rooms.length) scene.bg = rooms[0].id;
    readHash();
    $("randomize").addEventListener("click", randomize);
    $("download").addEventListener("click", download);
    $("circle").addEventListener("change", (e) => $("stage").classList.toggle("circle", e.target.checked));
    $("soft").addEventListener("change", render);
    $("share").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(location.href); toast("Link copied"); }
      catch { toast("Copy the address bar to share"); }
    });
    renderUI();
    render();
    // Height of the pinned phone preview, so the tab bar can pin just below it.
    const preview = document.querySelector(".preview");
    new ResizeObserver(() => {
      document.documentElement.style.setProperty("--pin-h", preview.offsetHeight + "px");
    }).observe(preview);
  }
  init();
})();
</script>
</body>
</html>
